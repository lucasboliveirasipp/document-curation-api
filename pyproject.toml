
[tool.poetry]
name = "api-agente-orientador-curadoria"
version = "1.0.0"
description = "BFF Agente Orientador Curadoria de Documentos"
authors = []
# O código-fonte fica em src/ (não numa pasta com o nome do projeto). Declaramos
# explicitamente o pacote para que o `poetry build` da pipeline empacote o src/.
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "1.0.1"
fastapi = "0.115.5"
uvicorn = {extras = ["standard"], version = "0.32.0"}
gunicorn = "23.0.0"
python-multipart = "0.0.9"
pydantic = "2.9.0"
requests = "2.32.3"
PyJWT = "2.9.0"
PyMuPDF = "1.24.11"
python-docx = "1.1.2"
openpyxl = "3.1.5"
python-pptx = "1.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
coverage = "7.6.1"
httpx = "0.27.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
